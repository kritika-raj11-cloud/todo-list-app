
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart To-Do List</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">YOUR PERSONAL PRODUCTIVITY SPACE</p>
        <h1>Smart To-Do List</h1>
        <p class="subtitle">Plan your day. Finish what matters.</p>
      </div>
      <div class="header-icon">✓</div>
    </header>

    <section class="stats">
      <div class="stat-card">
        <span>Total Tasks</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="stat-card">
        <span>Pending</span>
        <strong id="pendingCount">0</strong>
      </div>
      <div class="stat-card">
        <span>Completed</span>
        <strong id="completedCount">0</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Add a new task</h2>
      <form id="taskForm">
        <input
          id="taskInput"
          type="text"
          maxlength="200"
          placeholder="e.g. Complete college assignment"
          aria-label="New task"
          required
        />
        <button type="submit" id="addButton">+ Add Task</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="task-section">
      <div class="section-heading">
        <div>
          <h2>My Tasks</h2>
          <p>Keep track of your daily goals.</p>
        </div>
        <select id="filter" aria-label="Filter tasks">
          <option value="all">All Tasks</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <div id="taskList" class="task-list">
        <p class="empty">Loading tasks...</p>
      </div>
    </section>

  <footer>Smart To-Do List · Full Stack Web Application</footer>
  </main>
</body>
</html>
